<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Brooklyn Pizzaria</title>
</head>

<body>
    <header>
        <div class="informacoes">
            <a class="logo" href="index.html">
                Brooklyn <span>Pizzaria</span>
            </a>

            <nav class="menu_desktop">
                <ul>
                    <li><a href="#">Sobre Nós</a></li>
                    <li><a href="#">Contato</a></li>
                    <li><a href="#">Cardápio</a></li>
                </ul>
            </nav>

            <div class="btn_entre">
                <a href="#">
                    <button>Entre</button>
                </a>
            </div>
        </div>
    </header>
    
    <main>
        <section class="topo_do_site">

            <div class="background">
                <img src="images/background.svg" alt="">
            </div>

            <div class="interface">
                <div class="flex">
                    <div class="txt_topo_site">
                        <h2>Brooklyn Pizzaria</h2>
                        <h1>Venha conhecher nossos <span>melhores sabores</span>!</h1>
                        <p>Peça sua pizza favorita sem medo. Aqui nós fazemos com amor e cuidado.</p>

                        <div class="btn_entre">
                            <a href="#">
                                <button>Experimente</button>
                            </a>
                        </div>
                    </div>

                    <div class="img_topo_site">
                        <img src="images/banner.svg" alt="">
                    </div>
                </div>
            </div>

        </section>
    </main>


</body>
</html>
